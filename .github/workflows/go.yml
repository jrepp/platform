name: go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  store:
    uses: ./.github/workflows/go-check.yml
    with:
      module: go/store
      lint-config: ../../.golangci.yml

  workflows:
    uses: ./.github/workflows/workflow-check.yml

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Release configuration matches the modules on disk
        run: |
          set -euo pipefail
          # A module with no release-please entry is a module nobody can depend
          # on by version, which is the whole point of this repository.
          python3 - <<'PY'
          import json, pathlib, sys

          config = json.load(open("release-please-config.json"))
          configured = set(config["packages"])
          on_disk = {
              str(p.parent).replace("\\", "/")
              for p in pathlib.Path(".").rglob("go.mod")
              if ".git" not in p.parts
          }
          missing = on_disk - configured
          extra = configured - on_disk
          if missing:
              print(f"modules with no release-please entry: {sorted(missing)}", file=sys.stderr)
          if extra:
              print(f"release-please entries with no module: {sorted(extra)}", file=sys.stderr)
          sys.exit(1 if (missing or extra) else 0)
          PY
