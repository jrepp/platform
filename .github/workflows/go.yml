name: go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  store:
    name: go/store (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      # Every supported version is proven, so one failing version does not hide
      # the result for the others.
      fail-fast: false
      matrix:
        go: ["1.25.x", "1.26.x", "1.27.x"]
    env:
      # Build each module exactly as a consumer receives it. go/go.work sits one
      # directory above, and Go finds it by walking up, so without this the
      # module would be built in workspace mode and a missing dependency could
      # be masked by a sibling module.
      GOWORK: "off"
    defaults:
      run:
        working-directory: go/store
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ matrix.go }}
          # This module has no dependencies, so there is no go.sum to key a
          # cache on and nothing worth caching.
          cache: false
      - name: Check formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed for:"
            echo "$unformatted"
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    name: go/store lint
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.x"
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.4.0
          working-directory: go/store
          args: --config ../../.golangci.yml

  vulncheck:
    name: go/store govulncheck
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
    defaults:
      run:
        working-directory: go/store
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.x"
          cache: false
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
