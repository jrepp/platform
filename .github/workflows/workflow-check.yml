name: reusable workflow checks

on:
  workflow_call:
    inputs:
      runs-on:
        description: JSON runner label array chosen by the caller
        type: string
        default: '["ubuntu-latest"]'

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.1"
          cache: false
      - name: Validate workflows
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color
      - name: Require immutable external action and workflow references
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          failures = []
          for path in pathlib.Path('.github/workflows').iterdir():
              if path.suffix not in ('.yml', '.yaml'):
                  continue
              for value in re.findall(r'^\s*(?:-\s*)?uses:\s*([^\s#]+)', path.read_text(), re.M):
                  value = value.strip('\"\'')
                  if value.startswith('./'):
                      continue
                  if value.startswith('docker://'):
                      valid = re.search(r'@sha256:[0-9a-f]{64}$', value)
                  else:
                      valid = re.search(r'@[0-9a-f]{40}$', value)
                  if not valid:
                      failures.append(f'{path}: unpinned reference {value}')
          if failures:
              print('\n'.join(failures), file=sys.stderr)
              sys.exit(1)
          PY
